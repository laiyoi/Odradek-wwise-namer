name: Build WemLabeler

on:
  push:
    paths:
      - "WemLabeler/**"
      - "OdradekSharp"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # OdradekSharp is a git submodule, so it is NOT present in a plain checkout.
      # "recursive" also fetches its own nested submodule (external/odradek).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore WemLabeler/WemLabeler.csproj

      - name: Publish
        run: dotnet publish WemLabeler/WemLabeler.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WemLabeler
          path: publish/*
