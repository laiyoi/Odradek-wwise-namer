name: Build WemLabeler

on:
  push:
    # 分支推送：只在改动这些路径时构建
    # （注意：paths 过滤器对 tag 推送不生效，所以打标签时一定会触发）
    paths:
      - "WemLabeler/**"
      - "OdradekSharp"
      - ".github/workflows/build.yml"
    # 打形如 v1.0.0 的标签 -> 构建 + 自动发 Release
    tags:
      - "v*"
  workflow_dispatch:

# 创建 Release 需要写 contents 权限（默认是只读）
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # OdradekSharp is a git submodule, so it is NOT present in a plain checkout.
      # "recursive" also fetches its own nested submodule (external/odradek).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore WemLabeler/WemLabeler.csproj

      - name: Publish
        run: dotnet publish WemLabeler/WemLabeler.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WemLabeler
          path: publish/*

      # ---- 以下是打标签时才走的部分 ----

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/')
        id: package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $name = "WemLabeler-$tag-win-x64"
          Compress-Archive -Path publish/* -DestinationPath "$name.zip" -Force
          "zip=$name.zip" >> $env:GITHUB_OUTPUT
          Write-Host "打包完成: $name.zip ($([math]::Round((Get-Item "$name.zip").Length / 1MB, 2)) MB)"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "${{ steps.package.outputs.zip }}"

          # 标签的 Release 已经存在（例如重跑）就只覆盖附件，不报错
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，改为覆盖上传附件"
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip `
              --verify-tag `
              --title $tag `
              --generate-notes
          }
